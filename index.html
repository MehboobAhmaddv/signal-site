$('scw').innerHTML='<div class="card"><div class="hd"><h2 style="margin:0">💎 '+t('Ultra Scanner')+'</h2><button class="bt" id="scb">'+(SC.on?'● '+t('ON'):t('OFF'))+'</button></div><div class="sg">'+GROUPS.map(function(g){return'<div><b>'+g.tfs.map(tfn).join(' · ')+':</b> '+g.pairs.join(', ')+'</div>'}).join('')+'<div>'+t('Closed markets are skipped automatically.')+'</div></div>'+(rows||'<p style="font-size:13px">'+(SC.on?t('Scanning… keep this page open. Signals will appear here with an alert.'):t('Turn on to scan these pairs automatically while this page is open.'))+'</p>')+'</div>'}
$('scw').onclick=function(e){var r=e.target.closest&&e.target.closest('.sr');
if(r){S.pair=r.dataset.p;S.cat=catOf(S.pair);S.tf=+r.dataset.t;S.mode='ultra';save();fillPairs();ui();load();window.scrollTo({top:0,behavior:'smooth'});return}
if(e.target.id==='scb'){SC.on=!SC.on;try{localStorage.setItem('mhsc',SC.on?'1':'0')}catch(x){}wl(SC.on);if(SC.on){beep();try{if('Notification' in window&&Notification.permission==='default')Notification.requestPermission()}catch(x){}}scRender()}};
function scJobs(now){var out=[];GROUPS.forEach(function(g){var ss=g.src*60,b=(Math.floor(now/ss)+1)*ss;g.pairs.forEach(function(p,i){var due=b-g.lead+i*7.5;if(now>=due&&now<b-3){var k=p+'|'+g.src+'|'+b;if(!SC.done[k])out.push({k:k,p:p,g:g,b:b,due:due})}})});return out.sort(function(a,b){return a.due-b.due})}
async function scRun(j){SC.busy=true;SC.done[j.k]=1;SC.gap=Date.now()+3000;
try{var raw=await live(j.p,j.g.iv,0,1);j.g.tfs.forEach(function(tf){if(j.b%(tf*60)!==0)return;var cs=agg(raw,j.g.src,tf);resolveWith(j.p,tf,cs);var L=cs[cs.length-1];if(!L||L.t!==j.b-tf*60)return;
var A=EN.analyze(cs,'ultra',tf*60);if(A&&A.q){if(jadd(j.p,tf,'ultra',A,j.b,true)){SC.res.unshift({p:j.p,tf:tf,s:A.s,str:A.str,at:j.b});SC.res=SC.res.slice(0,12);scRender()}}})}
catch(e){if(/credit|limit|minute/i.test(String(e)))SC.gap=Date.now()+60000}
finally{SC.busy=false}}
function scTick(){SC.tick++;if(SC.tick%15===0)scRender();if(!SC.on||SC.busy||Date.now()<SC.gap)return;if(usage().n>=SC.cap)return;var now=Date.now()/1000;
if(Object.keys(SC.done).length>400)SC.done={};
var jobs=scJobs(now);for(var i=0;i<jobs.length;i++){var j=jobs[i];if(!mktOpen(catOf(j.p)).open){SC.done[j.k]=1;continue}scRun(j);return}}
window.addEventListener('tzchange',function(){if(S.raw)compute();else load();scRender()});
setInterval(scTick,1000);scRender();if(SC.on)wl(true);

/* ===== Pair list: only the selected market, each pair with its last-20-candle win rate (same number as the card) ===== */
var PS={stat:{},raw:{},sort:'def',busy:false,err:{}},PSGAP=1200,PCAP=5000,PTTL=15*60000,RTTL=8*60000;
try{var _ps=JSON.parse(localStorage.getItem('mhps')||'{}'),_n=Date.now();Object.keys(_ps).forEach(function(k){if(_n-_ps[k].t<30*60000)PS.stat[k]=_ps[k]})}catch(e){}
function pKey(p){return p+'|'+S.tf+'|'+S.mode}
function pSave(){try{localStorage.setItem('mhps',JSON.stringify(PS.stat))}catch(e){}}
function pPut(p,A){var k=pKey(p);PS.stat[k]={w:A.H.filter(function(h){return h.ok}).length,n:A.H.length||20,t:Date.now()};delete PS.err[k];pSave()}
function pMain(){var k=S.pair+'|'+SRC[S.tf][1],o=PS.raw[k];if(S.raw&&(!o||o.raw!==S.raw))PS.raw[k]={t:Date.now(),raw:S.raw};pPut(S.pair,S.A)}
function pCalc(p,raw){var tf=S.tf,s=tf*60,cs=agg(raw,SRC[tf][0],tf),now=Date.now()/1000,L=cs[cs.length-1];
 if(L&&L.t+s>now)cs=cs.slice(0,-1);cs=cs.length?cs:raw;var Lc=cs[cs.length-1];
 if(!Lc||now-Lc.t>Math.max(s*3,1200)){PS.err[pKey(p)]=Date.now()+PTTL;return}
 var A=EN.analyze(cs,S.mode,s);if(A)pPut(p,A);else PS.err[pKey(p)]=Date.now()+PTTL}
async function pRun(p){PS.busy=true;SC.gap=Date.now()+PSGAP;var k=pKey(p),iv=SRC[S.tf][1];
 try{var raw=await live(p,iv,1);PS.raw[p+'|'+iv]={t:Date.now(),raw:raw};pCalc(p,raw)}
 catch(e){if(/credit|limit|minute/i.test(String(e)))PS.hold=Date.now()+20000;else PS.err[k]=Date.now()+5*60000}
 finally{PS.busy=false;pRender()}}
function pList(){return CATS[S.cat]||[]}
function pNeed(p){if(locked(p)||!mkt(p).open)return false;var k=pKey(p),st=PS.stat[k];if(st&&Date.now()-st.t<PTTL)return false;return!(PS.err[k]&&PS.err[k]>Date.now())}
function pTick(){if(document.hidden||PS.busy||Date.now()<(PS.hold||0))return;var l=pList().slice().sort(function(a,b){return(b===S.pair)-(a===S.pair)});
 for(var i=0;i<l.length;i++){var p=l[i];if(!pNeed(p))continue;var r=PS.raw[p+'|'+SRC[S.tf][1]];
  if(r&&Date.now()-r.t<RTTL){try{pCalc(p,r.raw)}catch(e){PS.err[pKey(p)]=Date.now()+PTTL}pRender();return}
  if(SC.busy||Date.now()<SC.gap||usage().n>=PCAP)return;pRun(p);return}}
function pRender(){var el=$('plist');if(!el)return;var l=pList();
 var rows=l.map(function(p){var st=PS.stat[pKey(p)],lk=locked(p),op=mkt(p).open,pct=st?Math.round(st.w/st.n*100):null;return{p:p,st:st,lk:lk,op:op,pct:pct}});
 var ready=rows.filter(function(r){return r.st&&!r.lk&&r.op}).length;
 if(PS.sort==='best')rows.sort(function(a,b){return(b.pct==null?-1:b.pct)-(a.pct==null?-1:a.pct)});
 var ld=rows.some(function(r){return pNeed(r.p)});
 el.innerHTML='<div class="tfs plr" id="plr">'+rows.map(function(r){var c=r.pct==null?'':r.pct>=60?' pu':r.pct>=50?' pm':' pd',v;
  if(r.lk)v='🔒';else if(!r.op)v=t('Closed');else if(r.st)v=r.pct+'%';else v=ld?'…':'—';
  return'<button data-p="'+r.p+'" class="'+(r.p===S.pair?'on':'')+c+(r.lk||!r.op?' pl':'')+'"><b>'+r.p+'</b><i>'+v+'</i></button>'}).join('')+'</div>'+
 '<div class="plc"><span>'+t('Last 20 candles win rate')+' · '+tfn(S.tf)+(ld?' · '+ready+'/'+rows.length:'')+'</span><button class="bt" data-a="sort">⇅ '+(PS.sort==='best'?t('Best first'):t('Default order'))+'</button><button class="bt" data-a="ref">↻</button></div>';
 if(PS.focus){PS.focus=false;var row=$('plr'),on=row&&row.querySelector('.on');if(on)row.scrollLeft=on.offsetLeft-row.clientWidth/2+on.clientWidth/2}}
$('plist').onclick=function(e){var b=e.target.closest('button');if(!b)return;
 if(b.dataset.a==='sort'){PS.sort=PS.sort==='best'?'def':'best';pRender();return}
 if(b.dataset.a==='ref'){pList().forEach(function(p){delete PS.stat[pKey(p)];delete PS.err[pKey(p)];delete PS.raw[p+'|'+SRC[S.tf][1]]});PS.hold=0;pSave();pRender();return}
 var p=b.dataset.p;if(!p)return;var sc=$('plr').scrollLeft;S.pair=p;S.cat=catOf(p);save();ui();load();$('plr').scrollLeft=sc};
setInterval(pTick,700);setInterval(pRender,30000);
setInterval(tick,1000);ui();load();refreshMe();
</script></body></html>
