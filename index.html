'<div class="sig">'+arrow+'<div class="mid"><span class="dir '+cl+'">'+lab+'</span><div class="lb">'+t('ENTRY IN · NEXT CANDLE')+'</div><div class="cd" id="cd">--:--</div><div class="bar"><i id="pb"></i></div><div style="font-size:13px;color:var(--mu)">'+t('Entry')+': <b style="color:var(--tx)">'+pk(nx)+'</b> &nbsp; '+t('Expiry')+': <b style="color:var(--tx)">'+pk(nx+s)+'</b> PKT</div></div>'+
'<div class="rings">'+ring(A.str,'#38bdf8','STRENGTH')+ring(wr,'#e2e8f0','WIN RATE')+'</div></div>'+
'<div class="ft"><span>'+t('Risk')+': <span class="rk '+A.risk+'">'+t(A.risk)+'</span></span><span>'+t('Confluence')+': <b>'+A.conf+'/9</b></span><span><b>'+A.n+'</b> '+t('trades backtested')+'</span><span>'+t('Mode')+': <b>'+t(cap(S.mode))+'</b> ('+t('needs')+' '+A.M.c+'/9, '+A.M.s+'+'+(A.M.a?', ADX '+A.M.a+'+':'')+')</span></div>'+
(S.feed==='Live'?'':'<p class="warn">'+t('⚠ Showing simulated demo data, not real market prices. Reason: ')+String(S.why).replace(/[<>&]/g,'')+'</p>')+(S.stale?'<p class="warn">'+t('⚠ Market looks closed, so this signal is not tradable now.')+'</p>':'')+
'<p style="font-size:12px;margin-top:10px">'+t('Win rate = same rules replayed on this pair’s recent candles (past results, not a promise).')+'</p></div>'+
'<div class="g"><div class="card"><h2>'+t('Live indicator readings')+'</h2><table>'+A.V.map(function(v){return'<tr><td>'+t(v.n)+'</td><td>'+v.v+'</td><td><span class="v '+(v.d>0?'u':v.d<0?'d':'n')+'">'+(v.d>0?'CALL':v.d<0?'PUT':t('NEUTRAL'))+'</span></td></tr>'}).join('')+'<tr><td>'+t('ADX 14 (trend strength)')+'</td><td>'+A.adx.toFixed(1)+'</td><td><span class="v n">'+t(A.adx>=25?'STRONG':A.adx>=16?'MODERATE':'WEAK')+'</span></td></tr></table><p style="font-size:12px"><a href="learn.html#indicators" style="color:var(--ac)">'+t('Learn how each indicator works →')+'</a></p></div>'+

if(rc){var D=Math.floor(L/864e5),H=Math.floor(L%864e5/36e5),M=Math.floor(L%36e5/6e4),Z=Math.floor(L%6e4/1e3);rc.textContent=(D?D+'d ':'')+H+'h '+M+'m '+Z+'s'}}
var s=S.tf*60,n=Date.now()/1000,rem=s-(n%s),e=$('cd'),p=$('pb');
if(!S.closedUntil&&S.raw&&Math.floor(n/s)!==S.bar){S.bar=Math.floor(n/s);setTimeout(load,2500)}
if(e){var r=Math.ceil(rem),h=Math.floor(r/3600),m=Math.floor(r%3600/60),q=r%60;e.textContent=(h?h+':':'')+String(m).padStart(2,'0')+':'+String(q).padStart(2,'0');e.className='cd'+(r<=5?' hot':'');if(p)p.style.width=((1-rem/s)*100).toFixed(1)+'%'}}
setInterval(tick,1000);ui();load();refreshMe();
